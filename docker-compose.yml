services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      # Use OPENRAMP_DOCKER_OLLAMA_URL if set; ignore root .env OLLAMA_URL (often http://localhost:11434, which is wrong inside the backend container).
      OLLAMA_URL: ${OPENRAMP_DOCKER_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      AI_TIMEOUT: ${AI_TIMEOUT:-120}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    volumes:
      # Only runtime_cache: avoids masking image-shipped github_cache/ etc. with an empty volume.
      - openramp_backend_data:/app/src/data_layer/data/runtime_cache
    depends_on:
      - ollama

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  ollama_data:
  openramp_backend_data:
